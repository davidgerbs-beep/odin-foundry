# Hängt an ein veröffentlichtes Release die Assets odin-rpg.zip und system.json.
# Das Release selbst wird im Browser angelegt; der Tag muss v<version aus system.json> heißen.
# Inhalt des ZIP: alle Dateien des Systems aus dem Repo, ohne tests, werkzeuge, kartenraum,
# media, .github und Punktdateien, flach im Wurzelordner wie bei den bisherigen Releases.
name: Release-Assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - name: Stand des Tags auschecken
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Tag, Version und Download-Link prüfen
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(jq -r .version system.json)
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG passt nicht zur Version $VERSION in system.json (erwartet v$VERSION)."
            exit 1
          fi
          DOWNLOAD=$(jq -r .download system.json)
          ERWARTET="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/odin-rpg.zip"
          if [ "$DOWNLOAD" != "$ERWARTET" ]; then
            echo "::error::Download-Link in system.json ist $DOWNLOAD, erwartet $ERWARTET."
            exit 1
          fi

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: node --test

      - name: odin-rpg.zip bauen
        run: |
          git ls-files \
            | grep -v -E '^(tests|werkzeuge|kartenraum|media|\.github)/|^\.' \
            | zip -X -q odin-rpg.zip -@
          unzip -l odin-rpg.zip | tail -1
          unzip -l odin-rpg.zip system.json odin.mjs > /dev/null

      - name: Assets an das Release hängen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" odin-rpg.zip system.json --clobber --repo "$GITHUB_REPOSITORY"
